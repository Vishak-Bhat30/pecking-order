<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/art.css">
<style>
  * { animation: none !important; }
  body { margin: 0; background: #333; }
  .ic { position: relative; width: 512px; height: 512px; overflow: hidden; background: #FFD166; }
  .ic::before { content: ''; position: absolute; left: -50%; top: -50%; width: 200%; height: 200%;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.28) 0 9deg, transparent 9deg 18deg); }
  .ic::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, rgba(255,240,190,.9) 0 18%, transparent 55%); }
  .ic .c { position: absolute; z-index: 1; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .ic .c svg { width: 100%; height: 100%; display: block; }
  .any .c { width: 86%; height: 86%; margin-top: -2%; }
  .mask .c { width: 66%; height: 66%; margin-top: -1%; }
</style></head>
<body>
  <div class="ic any" id="any"><div class="c"></div></div>
  <div class="ic mask" id="mask"><div class="c"></div></div>
  <script type="module">
    import { characterSVG } from '../js/art.js';
    document.querySelectorAll('.c').forEach((c) => { c.innerHTML = characterSVG('rooster'); });
    document.body.dataset.ready = '1';
  </script>
</body></html>
